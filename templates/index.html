<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Zoológico</title>
    <!-- Aquí puedes enlazar tu CSS después -->
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/styles.css') }}">
</head>
<body>
    <h1>Lista de Animales</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            <!-- Ciclo para iterar sobre los registros -->
            {% for animal in animales %}
            <tr>
                <td>{{ animal.id }}</td>
                <td>{{ animal.nombre }}</td>
                <td>{{ animal.tipo }}</td>
                <td>{{ animal.edad }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No hay animales registrados aún.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
